<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blackjack Trainer</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <h1>Blackjack Trainer</h1>

  <!-- Settings Panel -->
  <form method="POST" action="/set_settings">
    <fieldset id="settings-panel">
      <legend>Settings</legend>
      <label for="deck-count">Number of decks:</label>
      <input type="number" id="deck-count" name="deck_count" min="1" max="10" value="6">
      <button type="submit">Update Settings</button>
    </fieldset>
  </form>

  <!-- Game Controls -->
  <div>
    <button id="start-button" type="button" onclick="startGame()">Start</button>
    <button id="hit-button" type="button" onclick="hit()">Hit</button>
    <button id="stand-button" type="button" onclick="stand()">Stand</button>
    <label>
      <input type="checkbox" id="suggestions-toggle" onchange="toggleSuggestions()" checked>
      Show suggestions
    </label>
  </div>

  <!-- Dealer Hand -->
  <div id="dealer-container" class="hand-container">
    <h2>Dealer's Hand</h2>
    <div id="dealer-hand"></div>
  </div>

  <!-- Player Hand -->
  <div id="player-container" class="hand-container">
    <h2>Your Hand</h2>
    <div id="player-hand"></div>
  </div>

  <!-- Message Display -->
  <div id="message"></div>
  <div id="suggestion" class="suggestion"></div>

  <script>
    let suggestionsEnabled = true;

    function toggleSuggestions() {
      suggestionsEnabled = document.getElementById("suggestions-toggle").checked;
    }

    function updateUI(data) {
      document.getElementById("start-button").style.display = data.showStartButton ? "inline-block" : "none";
      document.getElementById("hit-button").style.display = data.showActionButtons ? "inline-block" : "none";
      document.getElementById("stand-button").style.display = data.showActionButtons ? "inline-block" : "none";
      document.getElementById("dealer-container").style.display = data.showHandLabels ? "block" : "none";
      document.getElementById("player-container").style.display = data.showHandLabels ? "block" : "none";
      document.getElementById("message").textContent = data.result || data.message || "";
      document.getElementById("suggestion").textContent = data.suggestion || "";

      if (data.player) {
        renderHand("player-hand", data.player);
      } else {
        document.getElementById("player-hand").innerHTML = "";
      }

      if (data.dealer) {
        renderHand("dealer-hand", data.dealer);
      } else {
        document.getElementById("dealer-hand").innerHTML = "";
      }
    }

    async function startGame() {
      const res = await fetch("/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ suggestions: suggestionsEnabled })
      });
      const data = await res.json();
      updateUI(data);
    }

    async function hit() {
      const res = await fetch("/hit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ suggestions: suggestionsEnabled })
      });
      const data = await res.json();
      updateUI(data);
    }

    async function stand() {
      const res = await fetch("/stand", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ suggestions: suggestionsEnabled })
      });
      const data = await res.json();
      updateUI(data);
    }

    function renderHand(containerId, hand) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      hand.forEach(card => {
        const img = document.createElement("img");
        img.src = card.image;
        img.alt = `${card.value} of ${card.suit}`;
        img.className = "card";
        container.appendChild(img);
      });
    }

    updateUI({ showStartButton: true, showActionButtons: false, showHandLabels: false, result: "", suggestion: "" });
  </script>
</body>
</html>
